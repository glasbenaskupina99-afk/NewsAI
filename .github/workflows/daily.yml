name: Dnevna analiza medijev

on:
  schedule:
    - cron: "0 7 * * *"   # vsak dan ob 07:00 UTC
  workflow_dispatch:
    inputs:
      max_stories:
        description: "Največ zgodb za analizo (1 = poskusni zagon)"
        default: "5"

permissions:
  contents: write

concurrency:
  group: daily-analysis
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Namestitev odvisnosti
        run: pip install -r backend/requirements.txt

      - name: Testi
        working-directory: backend
        run: python -m unittest discover -s tests

      - name: Zagon cevovoda
        working-directory: backend
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          MAX_STORIES: ${{ inputs.max_stories || '5' }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::warning::Secret GEMINI_API_KEY ni nastavljen – zapisani bodo demo podatki."
          fi
          python main.py --max-stories "$MAX_STORIES"

      - name: Shrani zajete članke
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raw-articles
          path: data/raw_articles.json
          if-no-files-found: ignore

      - name: Commit rezultatov
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/daily_analysis.json
          if git diff --cached --quiet; then
            echo "Ni sprememb."
          else
            git commit -m "data: dnevna analiza $(date -u +%Y-%m-%d)"
            git push
          fi
