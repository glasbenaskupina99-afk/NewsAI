name: Dnevna analiza medijev

on:
  schedule:
    - cron: "0 7 * * *"   # vsak dan ob 07:00 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-analysis
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Namestitev odvisnosti
        run: pip install -r backend/requirements.txt

      - name: Testi
        working-directory: backend
        run: python -m unittest discover -s tests

      - name: Zagon cevovoda
        working-directory: backend
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::warning::Secret GEMINI_API_KEY ni nastavljen – zapisani bodo demo podatki."
          fi
          python main.py

      - name: Commit rezultatov
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/daily_analysis.json
          if git diff --cached --quiet; then
            echo "Ni sprememb."
          else
            git commit -m "data: dnevna analiza $(date -u +%Y-%m-%d)"
            git push
          fi
