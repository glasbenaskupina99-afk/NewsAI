name: Dnevna analiza medijev

on:
  schedule:
    - cron: "0 7 * * *"   # vsak dan ob 07:00 UTC
  workflow_dispatch:
    inputs:
      max_stories:
        description: "Največ zgodb za analizo (1 = poskusni zagon)"
        default: "5"

permissions:
  contents: write

concurrency:
  group: daily-analysis
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Namestitev odvisnosti
        run: pip install -r backend/requirements.txt

      - name: Testi
        working-directory: backend
        run: python -m unittest discover -s tests

      - name: Zagon cevovoda
        working-directory: backend
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          MAX_STORIES: ${{ inputs.max_stories || '5' }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::warning::Secret GEMINI_API_KEY ni nastavljen – zapisani bodo demo podatki."
          fi
          python main.py --max-stories "$MAX_STORIES"

      - name: Shrani zajete članke in rezultat
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: raw-articles
          path: |
            data/raw_articles.json
            data/run_result.json
          if-no-files-found: ignore

      - name: Commit rezultatov
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branch="${GITHUB_REF_NAME}"
          git add data/daily_analysis.json data/media_stats.json data/archive
          if git diff --cached --quiet; then
            echo "Ni sprememb."
            exit 0
          fi
          git commit -m "data: dnevna analiza $(date -u +%Y-%m-%d)"
          for attempt in 1 2 3; do
            if git push origin "HEAD:${branch}"; then
              exit 0
            fi
            echo "::warning::Push zavrnjen (poskus ${attempt}): na veji so novejši commiti."
            git fetch origin "${branch}"
            if git rebase "origin/${branch}"; then
              continue
            fi
            # Spor v podatkih (npr. vmes potisnjena ročna analiza): rezultat objavimo znova na
            # novejšem stanju, da se ročne in samodejne zgodbe združijo (main.py --republish).
            git rebase --abort
            git reset --hard "origin/${branch}"
            if [ ! -f data/run_result.json ]; then
              echo "::error::Ni shranjenega rezultata za ponovno objavo."
              exit 1
            fi
            (cd backend && python main.py --republish ../data/run_result.json)
            git add data/daily_analysis.json data/media_stats.json data/archive
            git diff --cached --quiet || git commit -m "data: dnevna analiza $(date -u +%Y-%m-%d)"
            sleep $((attempt * 5))
          done
          echo "::error::Push ni uspel po 3 poskusih; rezultat je v artefaktu raw-articles."
          exit 1
